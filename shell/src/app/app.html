<div style="padding: 20px; border: 2px solid #4CAF50; margin: 10px; background-color: #f0f8ff;">
  <h1>🏠 Shell Application</h1>
  
  <div style="margin: 20px 0;">
    <h3>Navigation:</h3>
    <nav style="margin: 10px 0;">
      <a routerLink="/mfe1" style="margin-right: 15px; padding: 8px 16px; background: #2196F3; color: white; text-decoration: none; border-radius: 4px;">Angular MFE1</a>
      <a routerLink="/mfe2" style="padding: 8px 16px; background: #FF5722; color: white; text-decoration: none; border-radius: 4px;">React MFE2</a>
    </nav>
  </div>

  <div style="margin: 20px 0; padding: 15px; background: #fff3cd; border-radius: 4px;">
    <h3>📡 Send Data to Microfrontends:</h3>
    <button (click)="sendToMFE1()" style="margin: 5px; padding: 10px 20px; background: #2196F3; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Send to MFE1
    </button>
    <button (click)="sendToMFE2()" style="margin: 5px; padding: 10px 20px; background: #FF5722; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Send to MFE2
    </button>
    <button (click)="sendToAll()" style="margin: 5px; padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Broadcast to All
    </button>
  </div>

  <div style="margin: 20px 0; padding: 15px; background: #e8f5e9; border-radius: 4px;">
    <h3>📥 Received Data:</h3>
    <p style="font-family: monospace; background: white; padding: 10px; border-radius: 4px;">{{ receivedData() }}</p>
  </div>
</div>

<div style="margin: 20px 10px;">
  <router-outlet></router-outlet>
</div>
